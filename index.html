<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pomodoro — Study Timer 🍅</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06090f;--card:#0c1220;--border:#1a2840;--text:#e2e8f0;--dim:#64748b;--sub:#94a3b8;--blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--purple:#a78bfa;--tomato:#ef4444;--mint:#22c55e}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate}
@keyframes twinkle{from{opacity:.1}to{opacity:.6}}
nav{position:sticky;top:0;z-index:100;background:#06090fee;backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:56px}
.nav-back{font-size:.8rem;font-weight:700;color:var(--dim);text-decoration:none;padding:5px 12px;border:1px solid var(--border);border-radius:20px;transition:color .2s}
.nav-back:hover{color:var(--text)}
.nav-title{font-size:1.1rem;font-weight:900;color:var(--tomato);margin-right:auto}

.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:36px 20px;text-align:center}

/* MODE TABS */
.mode-tabs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:4px;margin-bottom:32px}
.mode-tab{padding:8px 20px;border-radius:50px;border:none;background:transparent;color:var(--dim);font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.mode-tab.work.active{background:var(--tomato);color:#fff}
.mode-tab.short.active{background:var(--mint);color:#000}
.mode-tab.long.active{background:var(--blue);color:#fff}

/* RING TIMER */
.ring-container{position:relative;width:240px;height:240px;margin:0 auto 28px}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:10}
.ring-progress{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .5s}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-big{font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer-label{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-top:6px}
.timer-session{font-size:.7rem;color:var(--dim);margin-top:3px}

/* BUTTONS */
.ctrl-row{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.ctrl-btn{padding:14px 32px;border-radius:50px;border:none;font-weight:800;font-size:1rem;cursor:pointer;transition:all .2s}
.ctrl-btn:hover{transform:scale(1.04)}
.ctrl-btn:active{transform:scale(.97)}
.ctrl-start{background:var(--tomato);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.3)}
.ctrl-start.break{background:var(--mint);color:#000;box-shadow:0 4px 20px rgba(34,197,94,.3)}
.ctrl-skip{background:var(--card);color:var(--sub);border:1px solid var(--border)}
.ctrl-reset{background:var(--card);color:var(--sub);border:1px solid var(--border)}

/* TASK */
.task-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:20px;text-align:left}
.task-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--tomato);margin-bottom:8px}
.task-input{width:100%;background:transparent;border:none;color:var(--text);font-size:.95rem;outline:none;font-family:inherit}
.task-input::placeholder{color:var(--dim)}

/* SESSIONS */
.sessions-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px}
.sessions-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:12px;text-align:left}
.session-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.session-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);transition:all .3s}
.session-dot.done{background:var(--tomato);border-color:var(--tomato)}
.session-dot.current{background:transparent;border-color:var(--tomato);animation:pulseDot 1s ease infinite alternate}
@keyframes pulseDot{from{transform:scale(1)}to{transform:scale(1.3)}}
.sessions-stats{display:flex;justify-content:space-around}
.ss-item{text-align:center}
.ss-val{font-size:1.4rem;font-weight:900}
.ss-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-top:2px}

/* SETTINGS */
.settings-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.setting-pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s}
.setting-pill.active{border-color:var(--tomato);background:#1f0a0a;color:var(--tomato)}
.setting-pill.break-active{border-color:var(--mint);background:#0a1f10;color:var(--mint)}

/* Motivational */
.motivation{font-size:.88rem;color:var(--sub);font-style:italic;min-height:24px;margin-bottom:8px}

/* Notification banner */
.notif-banner{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:50px;padding:12px 24px;font-size:.9rem;font-weight:700;z-index:200;transition:all .4s;opacity:0;pointer-events:none;white-space:nowrap}
.notif-banner.show{opacity:1}
</style>
</head>
<body>
<div id="stars"></div>
<nav>
  <a href="https://eppeok.github.io" class="nav-back">← All Tools</a>
  <div class="nav-title">🍅 Pomodoro</div>
  <a href="https://eppeok.github.io/student-dashboard/" class="nav-back">Dashboard</a>
</nav>

<div class="page">
  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab work active" onclick="setMode('work')">🍅 Focus</button>
    <button class="mode-tab short" onclick="setMode('short')">☕ Short Break</button>
    <button class="mode-tab long" onclick="setMode('long')">🌿 Long Break</button>
  </div>

  <!-- Task input -->
  <div class="task-box">
    <div class="task-label">What are you working on?</div>
    <input type="text" class="task-input" id="task-input" placeholder="e.g. Maths revision — Chapter 7..." maxlength="80"/>
  </div>

  <!-- Ring timer -->
  <div class="ring-container">
    <svg class="ring-svg" width="240" height="240" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="108"/>
      <circle class="ring-progress" id="ring" cx="120" cy="120" r="108"
        stroke="#ef4444"
        stroke-dasharray="678.6"
        stroke-dashoffset="0"/>
    </svg>
    <div class="timer-center">
      <div class="timer-big" id="timer-big">25:00</div>
      <div class="timer-label" id="timer-label">FOCUS</div>
      <div class="timer-session" id="timer-session">Session 1 of 4</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrl-row">
    <button class="ctrl-btn ctrl-reset" onclick="resetTimer()">↺</button>
    <button class="ctrl-btn ctrl-start" id="start-btn" onclick="toggleTimer()">▶ Start</button>
    <button class="ctrl-btn ctrl-skip" onclick="skipPhase()">⏭</button>
  </div>

  <!-- Motivation -->
  <div class="motivation" id="motivation">Pick a task and start your first focus session.</div>

  <!-- Settings -->
  <div style="text-align:left;margin-bottom:8px">
    <span style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim)">Focus Duration</span>
  </div>
  <div class="settings-row" id="work-pills">
    <button class="setting-pill" data-mins="15" onclick="setWorkDur(this)">15m</button>
    <button class="setting-pill active" data-mins="25" onclick="setWorkDur(this)">25m</button>
    <button class="setting-pill" data-mins="30" onclick="setWorkDur(this)">30m</button>
    <button class="setting-pill" data-mins="45" onclick="setWorkDur(this)">45m</button>
    <button class="setting-pill" data-mins="50" onclick="setWorkDur(this)">50m</button>
  </div>
  <div style="text-align:left;margin-bottom:8px">
    <span style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim)">Short Break</span>
  </div>
  <div class="settings-row" id="break-pills">
    <button class="setting-pill break-active" data-mins="5" onclick="setBreakDur(this)">5m</button>
    <button class="setting-pill" data-mins="10" onclick="setBreakDur(this)">10m</button>
    <button class="setting-pill" data-mins="15" onclick="setBreakDur(this)">15m</button>
  </div>

  <!-- Sessions -->
  <div class="sessions-box">
    <div class="sessions-label">Today's Sessions</div>
    <div class="session-dots" id="session-dots"></div>
    <div class="sessions-stats">
      <div class="ss-item"><div class="ss-val" id="ss-done" style="color:var(--tomato)">0</div><div class="ss-lbl">Completed</div></div>
      <div class="ss-item"><div class="ss-val" id="ss-mins" style="color:var(--yellow)">0</div><div class="ss-lbl">Focus Mins</div></div>
      <div class="ss-item"><div class="ss-val" id="ss-streak" style="color:var(--purple)">0🔥</div><div class="ss-lbl">Day Streak</div></div>
    </div>
  </div>
</div>

<div class="notif-banner" id="notif-banner"></div>

<script>
(()=>{const c=document.getElementById('stars');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+1;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:.3`;c.appendChild(s);}})();

// State
let mode='work'; // work | short | long
let workMins=25, breakMins=5, longMins=15;
let secs=workMins*60, totalSecs=workMins*60;
let running=false, interval=null;
let sessionsDone=0, focusMins=0;
const SESSIONS_BEFORE_LONG=4;
const CIRCUMFERENCE=2*Math.PI*108; // 678.6

const WORK_MSGS=["Focus mode on 🔥","You've got this!","Deep work = big results.","Stay off your phone 📵","One task at a time.","The best time to focus is now.","Every minute counts.","Block out distractions.","Future you will be grateful.","Stay locked in 💪"];
const BREAK_MSGS=["Well earned! Rest up ☕","Step away from the screen.","Stretch, breathe, hydrate 💧","Great work — take a moment.","Short breaks = better focus.","Rest is part of the process 🌿"];

function notify(msg){
  const el=document.getElementById('notif-banner');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

// Audio beep
function beep(freq=440,dur=0.3,vol=0.3,type='sine'){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=freq;osc.type=type;
    gain.gain.setValueAtTime(vol,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+dur+0.1);
  }catch(e){}
}
function doneSound(){beep(523,.15);setTimeout(()=>beep(659,.15),160);setTimeout(()=>beep(784,.4),320);}
function startSound(){beep(440,.1,.2);}

function getDur(m){return{work:workMins*60,short:breakMins*60,long:longMins*60}[m];}
function getModeLabel(m){return{work:'FOCUS',short:'SHORT BREAK',long:'LONG BREAK'}[m];}
function getModeColor(m){return{work:'#ef4444',short:'#22c55e',long:'#3b82f6'}[m];}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.mode-tab.'+m).classList.add('active');
  resetTimer();
}

function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}

function updateDisplay(){
  document.getElementById('timer-big').textContent=fmtTime(secs);
  document.getElementById('timer-label').textContent=getModeLabel(mode);
  document.getElementById('timer-session').textContent=`Session ${Math.floor(sessionsDone/1)+1} of ${SESSIONS_BEFORE_LONG}`;
  // Ring
  const ring=document.getElementById('ring');
  const pct=secs/totalSecs;
  ring.style.strokeDashoffset=CIRCUMFERENCE*(1-pct);
  ring.style.stroke=getModeColor(mode);
  // Start btn
  const btn=document.getElementById('start-btn');
  btn.textContent=running?'⏸ Pause':'▶ Start';
  btn.className='ctrl-btn ctrl-start'+(mode!=='work'?' break':'');
  // Motivation
  if(running){
    if(secs===totalSecs) document.getElementById('motivation').textContent=(mode==='work'?WORK_MSGS:BREAK_MSGS)[Math.floor(Math.random()*(mode==='work'?WORK_MSGS:BREAK_MSGS).length)];
  }
}

function toggleTimer(){
  if(running){pause();}else{start();}
}

function start(){
  running=true;
  startSound();
  if(secs===totalSecs&&mode==='work') document.getElementById('motivation').textContent=WORK_MSGS[Math.floor(Math.random()*WORK_MSGS.length)];
  interval=setInterval(()=>{
    secs--;
    updateDisplay();
    if(secs<=0) phaseComplete();
  },1000);
  updateDisplay();
}

function pause(){
  running=false;
  clearInterval(interval);
  updateDisplay();
}

function resetTimer(){
  pause();
  totalSecs=getDur(mode);
  secs=totalSecs;
  updateDisplay();
  document.getElementById('motivation').textContent='Pick a task and start your focus session.';
}

function phaseComplete(){
  clearInterval(interval);running=false;
  doneSound();
  if(mode==='work'){
    sessionsDone++;
    focusMins+=workMins;
    saveStats();
    renderDots();
    updateStats();
    const isLong=(sessionsDone%SESSIONS_BEFORE_LONG===0);
    notify(isLong?'🍅 Focus complete! Time for a long break 🌿':'🍅 Focus complete! Take a short break ☕');
    setMode(isLong?'long':'short');
  } else {
    notify('☕ Break over — back to work!');
    setMode('work');
  }
}

function skipPhase(){
  clearInterval(interval);running=false;
  if(mode==='work'){const isLong=(sessionsDone%SESSIONS_BEFORE_LONG===SESSIONS_BEFORE_LONG-1);setMode(isLong?'long':'short');}
  else setMode('work');
}

function setWorkDur(el){
  if(running) return;
  document.querySelectorAll('#work-pills .setting-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  workMins=parseInt(el.dataset.mins);
  if(mode==='work'){totalSecs=workMins*60;secs=totalSecs;updateDisplay();}
}

function setBreakDur(el){
  if(running) return;
  document.querySelectorAll('#break-pills .setting-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  breakMins=parseInt(el.dataset.mins);
  if(mode==='short'){totalSecs=breakMins*60;secs=totalSecs;updateDisplay();}
}

// Stats persistence
function getPomoData(){try{return JSON.parse(localStorage.getItem('pomo_stats')||'{}');}catch{return {};}}
function savePomoData(d){try{localStorage.setItem('pomo_stats',JSON.stringify(d));}catch{}}

function saveStats(){
  const today=new Date().toDateString();
  const data=getPomoData();
  if(data.date!==today){data.date=today;data.sessions=0;data.mins=0;}
  data.sessions=(data.sessions||0)+1;
  data.mins=(data.mins||0)+workMins;
  // Streak
  const yesterday=new Date(Date.now()-86400000).toDateString();
  if(data.lastDay===yesterday){data.streak=(data.streak||0)+1;}
  else if(data.lastDay!==today){data.streak=1;}
  data.lastDay=today;
  savePomoData(data);
}

function loadStats(){
  const today=new Date().toDateString();
  const data=getPomoData();
  if(data.date===today){sessionsDone=data.sessions||0;focusMins=data.mins||0;}
}

function updateStats(){
  document.getElementById('ss-done').textContent=sessionsDone;
  document.getElementById('ss-mins').textContent=focusMins;
  const data=getPomoData();
  document.getElementById('ss-streak').textContent=(data.streak||0)+'🔥';
}

function renderDots(){
  const dots=document.getElementById('session-dots');
  const target=SESSIONS_BEFORE_LONG;
  const completed=sessionsDone%SESSIONS_BEFORE_LONG||sessionsDone;
  dots.innerHTML=Array.from({length:target},(_,i)=>`<div class="session-dot${i<(sessionsDone%target||sessionsDone>=target?sessionsDone%target:0)?' done':i===(sessionsDone%target)?running?' current':'':''}""></div>`).join('');
}

// Init
loadStats();
updateStats();
renderDots();
updateDisplay();
</script>
</body>
</html>
